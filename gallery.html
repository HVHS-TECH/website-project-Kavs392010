<script>
let scrollPositions = {};

function moveSlide(id, direction) {
  const slides = document.getElementById(id);

  if (!scrollPositions[id]) {
    scrollPositions[id] = 0;
  }

  const step = 260;
  scrollPositions[id] += direction * step;

  scrollPositions[id] = Math.max(0, scrollPositions[id]);
  scrollPositions[id] = Math.min(
    scrollPositions[id],
    slides.scrollWidth - slides.clientWidth
  );

  slides.style.transform = `translateX(-${scrollPositions[id]}px)`;
}
</script>
<script>
document.querySelectorAll(".video-card").forEach(card => {
  const video = card.querySelector("video");

  card.addEventListener("mouseenter", () => {
    video.currentTime = 0;
    video.play();
  });

  card.addEventListener("mouseleave", () => {
    video.pause();
  });
});
</script>
